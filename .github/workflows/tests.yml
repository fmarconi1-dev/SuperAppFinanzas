# Corre la suite en cada push y PR, en una máquina limpia.
#
# POR QUE EXISTE: hasta la Fase 4 los tests corrían solo cuando Franco los
# corría a mano. Eso dejó pasar dos cosas el 4/8/2026: su entorno local se
# quedó sin dependencias (Python 3.14 sin instalar nada) y la suite ni
# siquiera colectaba, y nadie se entera hasta que alguien mira. Correrlo desde
# cero es ademas la unica forma de detectar que algo funciona en su PC "de
# casualidad" — por una dependencia instalada a mano, por ejemplo.
#
# Python 3.11: la misma version del Dockerfile. Si CI pasara en otra version,
# no probaria lo que se despliega.

name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:      # para poder dispararlo a mano desde la web

jobs:
  tests:
    name: Suite (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Correr la suite
        # El gate de reconciliación (tests/test_cartera_recon.py) se saltea
        # solo: necesita el Excel de Franco, que NUNCA se versiona. Que
        # aparezca como "skipped" acá es lo correcto — ese gate corre local.
        run: pytest -q --durations=10

  sin-datos:
    name: No hay datos financieros versionados
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # El pre-commit hook ya bloquea esto, pero vive en la PC de Franco y se
      # puede saltear con --no-verify. Esta es la red que no se puede puentear.
      # Mira el arbol COMPLETO, no solo el diff: un archivo pudo haber entrado
      # en un commit viejo.
      - name: Buscar archivos de datos en el repo
        run: |
          echo "Revisando el arbol completo..."
          ENCONTRADOS=$(git ls-files \
            | grep -Ei '\.(xlsx|xls|db|sqlite3?|csv)$|(^|/)\.env($|\.)' \
            | grep -Ev '\.env\.example$' || true)
          if [ -n "$ENCONTRADOS" ]; then
            echo "::error::Hay archivos de datos financieros versionados:"
            echo "$ENCONTRADOS" | sed 's/^/  - /'
            echo "Regla dura del repo: data/, *.xlsx, *.db, *.csv y .env NUNCA se versionan."
            exit 1
          fi
          echo "OK: ningun archivo de datos versionado."

      - name: Buscar claves privadas
        run: |
          ENCONTRADOS=$(git grep -lE 'BEGIN (RSA|OPENSSH|DSA|EC|PGP) PRIVATE KEY' -- . || true)
          if [ -n "$ENCONTRADOS" ]; then
            echo "::error::Hay claves privadas versionadas:"
            echo "$ENCONTRADOS" | sed 's/^/  - /'
            exit 1
          fi
          echo "OK: sin claves privadas."
