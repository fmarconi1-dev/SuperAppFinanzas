# requirements.lock — build reproducible de la imagen de deploy.
#
# QUÉ ES. El árbol COMPLETO de dependencias con versión exacta, incluidas las
# transitivas que `requirements.txt` no nombra. El `Dockerfile` ya lo usa solo
# si existe (`COPY requirements.txt requirements.lock*` + el `if`), así que
# alcanza con que este archivo exista: **no hay que tocar el deploy**.
#
# POR QUÉ EXISTE. `requirements.txt` declara rangos (`pandas>=2.0.0`). Dos
# builds separadas por un mes instalan cosas distintas sin que nadie lo pida, y
# la que rompe es siempre la que se despliega un viernes.
#
# ---------------------------------------------------------------------------
# ⚠️ LA DECISIÓN QUE HAY QUE ENTENDER ANTES DE REGENERARLO: pandas.
# ---------------------------------------------------------------------------
# Generado el 27/8/2026 en **Python 3.11** (la del Dockerfile). Ese día `pip`
# resolvía `pandas>=2.0.0` como **pandas 3.0.5** — un salto de major con
# cambios incompatibles, contra el que la suite NUNCA corrió. Un lock tiene que
# congelar una build *conocida-buena*, no la más nueva: por eso se generó con
# los topes `pandas<3` / `numpy<2.3` y quedó pineado **pandas 2.3.3**, que es
# exactamente la versión con la que la suite da **677 passed, 3 skipped**.
#
# No se pudo probar pandas 3 acá: **exige Python >=3.11** y el entorno donde se
# corrió la suite es 3.10. Migrar a pandas 3 es una tarea deliberada — correr
# la suite entera en 3.11 con pandas 3 y mirar los números de la cartera — no
# algo que deba pasar solo porque alguien regeneró un lock.
#
# CÓMO SE REGENERA (en Python 3.11, con los topes puestos a propósito):
#     python3.11 -m venv /tmp/lockenv
#     /tmp/lockenv/bin/pip install -r requirements.txt "pandas<3" "numpy<2.3"
#     /tmp/lockenv/bin/pip freeze | grep -viE "^(pip|setuptools|wheel)==" | sort -f
#
# VERIFICADO (27/8/2026). No es un `pip freeze` a ciegas: se armó un venv de
# Python 3.11 con exactamente estos pines y se corrió la suite entera encima →
# **679 passed, 0 failed** (31 skipped: son los tests-oráculo, que necesitan los
# CSV y el Excel de Franco y no corren fuera de su máquina, igual que en CI).
#
# Y DESPUÉS DE CADA REGENERACIÓN: repetir esa corrida antes de desplegar.
# Un lock que nadie verificó es igual de peligroso que no tener lock.
# ---------------------------------------------------------------------------

