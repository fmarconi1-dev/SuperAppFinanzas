# Superapp de Finanzas — config Fly.io (Fase 1: Lugar A migrado)
# Config heredada del fly.toml probado de radar-financiero.
app = "superapp-finanzas"
primary_region = "iad"  # Ashburn (EE.UU.). Hasta el 20/10/2026 fue "gru" (São Paulo): ese día
                        # el host de gru se quedó sin memoria y la app se mudó (ver RUNBOOK).
                        # Fly ya no tiene otra región en Sudamérica.

[build]

# Reemplazo directo en vez de rolling. NO es una optimización: es el único
# modo que funciona de manera confiable con esta topología.
#
# Rolling (el default) levanta la máquina nueva, la verifica y recién ahí baja
# la vieja: durante el cambio pide **el doble de recursos** (2 GB de RAM, 2
# CPUs). Y como la máquina está atada al volumen `finanzas_data`, no puede
# mudarse a otro host: donde está el volumen, ahí tiene que correr. Si ese host
# está justo, el deploy falla.
#
# Paso dos veces el 4/8/2026, con los dos mensajes de la familia:
#   insufficient CPUs available ... cpu_overcommit_exceeded
#   insufficient memory available to fulfill request on the current host
#
# Con UNA sola máquina el solapamiento no compra nada: no hay alta
# disponibilidad que proteger. El costo de `immediate` son unos segundos de
# caída, y esta es una app personal: la pantalla se recarga y listo.
[deploy]
  strategy = "immediate"

[http_service]
  internal_port = 8501
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/_stcore/health"
    timeout = "5s"

[[vm]]
  memory = "1gb"   # holgado para pandas/plotly
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "finanzas_data"   # crear con: fly volumes create finanzas_data -r iad -s 1
  destination = "/app/data"  # acá viven la DB y los backups
