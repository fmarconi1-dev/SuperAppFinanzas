# Superapp de Finanzas — config Fly.io (Fase 1: Lugar A migrado)
# Config heredada del fly.toml probado de radar-financiero.
app = "superapp-finanzas"
primary_region = "gru"  # São Paulo

[build]

[http_service]
  internal_port = 8501
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/_stcore/health"
    timeout = "5s"

[[vm]]
  memory = "1gb"   # holgado para pandas/plotly
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "finanzas_data"   # crear con: fly volumes create finanzas_data -r gru -s 1
  destination = "/app/data"  # acá viven la DB y los backups
