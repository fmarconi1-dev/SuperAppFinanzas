       superficie Cosmic Slate #18181B con borde #27272A. -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#18181B" stroke="#27272A" stroke-width="2"/>
  <!-- Ala izquierda -->
  <path d="M27 28.5 L14.5 21.5 Q11 19.8 11 23.6 V40.4 Q11 44.2 14.5 42.5 L27 35.5 Z" fill="#8B5CF6"/>
  <path d="M27 30.5 L17 26 V38 L27 33.5 Z" fill="#A78BFA" opacity="0.55"/>
  <!-- Ala derecha -->
  <path d="M37 28.5 L49.5 21.5 Q53 19.8 53 23.6 V40.4 Q53 44.2 49.5 42.5 L37 35.5 Z" fill="#8B5CF6"/>
  <path d="M37 30.5 L47 26 V38 L37 33.5 Z" fill="#A78BFA" opacity="0.55"/>
  <!-- Nudo -->
