<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Secretario (17/10/2026): un globo de chat (el canal es WhatsApp) con un
       tilde adentro (lo que el Secretario resuelve). Colores Cosmic Slate:
       superficie #18181B, borde #27272A, acento violeta #8B5CF6. -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#18181B" stroke="#27272A" stroke-width="2"/>
  <!-- Globo de chat -->
  <path d="M17 18h30a5 5 0 0 1 5 5v15a5 5 0 0 1-5 5H30l-8 7v-7h-5a5 5 0 0 1-5-5V23a5 5 0 0 1 5-5z"
        fill="#8B5CF6"/>
  <!-- Tilde -->
  <path d="M23 30.5l5.5 5.5L41 23.5" fill="none" stroke="#F8FAFC" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
