[pytest]
testpaths = tests

# `Borrar/` es la carpeta donde van a parar los archivos que git no puede
# borrar por el conflicto con OneDrive (`rm` falla con "Operation not
# permitted", solo funciona `mv`). Franco la vacía antes de cada push.
#
# Sin esta exclusión pytest la recorre y colecta código retirado: pasó el
# 5/8/2026 al sacar el módulo de Scoring — su test viejo quedó en `Borrar/`,
# pytest lo levantó igual y la suite entera murió en la colección con
# `ModuleNotFoundError`. El código estaba bien; lo que estaba mal era mirar
# ahí adentro.
norecursedirs = Borrar backups-remotos data .git .venv __pycache__ *.egg
