# nginx de la SuperApp (Fase A, ADR-0008). Se copia a /etc/nginx/conf.d/.
#
# Fly expone UN puerto (8501, `fly.toml`), y desde la Fase A hay dos procesos:
#   /api/  → la API stdlib en 127.0.0.1:8000 (webhook de WhatsApp)
#   /      → Streamlit en 127.0.0.1:8502
# Así `fly.toml` no cambia: mismo puerto, mismo health check
# (`/_stcore/health`, que pasa por acá hacia Streamlit).
#
# Va dentro del bloque `http {}` del nginx.conf de Debian (conf.d/*.conf).

# Streamlit vive de un websocket: sin Upgrade/Connection, la app no carga.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Log sin query string ($uri, no $request): en la verificación del webhook
# viaja el verify token de Meta.
log_format superapp '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

server {
    listen 8501 default_server;
    listen [::]:8501 default_server;

    access_log /dev/stdout superapp;
    error_log  /dev/stderr warn;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Un webhook de Meta pesa pocos KB.
        client_max_body_size 1m;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:8502;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # El websocket queda abierto mientras la pestaña esté abierta: con el
        # timeout default (60 s) nginx lo cortaría y la app se reconectaría
        # una y otra vez.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        # El uploader de Streamlit acepta hasta 200 MB (el Excel del banco).
        client_max_body_size 200m;
    }
}
